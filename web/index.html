<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Grade9 — Multi-Disciplinary Curriculum &amp; Olympiad Platform</title>
  <style>
    :root {
      --g9-font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --g9-font-math: "Cambria Math", "STIX Two Math", "Latin Modern Math", "KaTeX_Math", "Times New Roman", serif;
      --g9-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f4f7fa;
    }
    body {
      font-family: var(--g9-font-family);
      font-size: 17px;
      line-height: 1.6;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    math, .g9-math {
      font-family: var(--g9-font-math);
      font-size: 1.05em;
    }
    .math-block-container {
      font-family: var(--g9-font-math);
      font-size: 1.05em;
      margin: 0.5rem 0;
    }
    .math-inline-container {
      font-family: var(--g9-font-math);
      display: inline-block;
      vertical-align: middle;
    }
    #app {
      min-height: 100vh;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app/main.ts"></script>
</body>
</html>
