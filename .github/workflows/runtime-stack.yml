name: Runtime stack audit
on:
  push:
    branches:
      - feat/a48-immutable-cognitive-event-persistence
      - main
      - fix/runtime-integrity-r2
      - 'integration/downstream-*'
  workflow_dispatch:
concurrency:
  group: runtime-stack-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Strict typecheck and build
        run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Compile actual public projection fixture
        run: |
          python -m pip install -e '.[dev]'
          python -c 'import json; from grade9build.compile import ReleaseProjectionCompiler; print(json.dumps(ReleaseProjectionCompiler().compile_release(json.load(open("fixtures/synthetic/graph.json"))), ensure_ascii=False))' > "$RUNNER_TEMP/g9-projection.json"
          echo "G9_COMPILED_PROJECTION=$RUNNER_TEMP/g9-projection.json" >> "$GITHUB_ENV"
      - name: Runtime regression and adversarial tests
        if: always() && !cancelled()
        run: node --experimental-strip-types --test tests/runtime/*.test.ts tests/runtime/*.spec.ts
      - name: Self-contained Python contract and release regression
        if: always() && !cancelled()
        run: |
          echo 'NOT_RUN: test_platform.py requires external G9_R4_KIT; test_portable_compatibility.py requires external G9_V35_PORTABLE_PACKAGES. Full custody-dependent regression is separate.'
          PATH="$PWD/node_modules/.bin:$PATH" python -m pytest tests/contracts tests/build tests/release tests/search --ignore=tests/contracts/test_platform.py --ignore=tests/contracts/test_portable_compatibility.py -q
      - name: Checkout exact v3.5 public search sources (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: reallakshman19/Grade9v3.5
          ref: 8a02a8eb23ea37a7d8acb74d1bc193dd17657e5b
          path: .source-v35-search
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/data/resource-registry.v1.json
            /public/data/learner-search-index.v1.json
      - name: Checkout exact v4.1 public search sources (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: reallakshman19/Grade9v4.1
          ref: 564ad2a07fddc0fdd30d103674b3eca61235a54b
          path: .source-v41-search
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/learner-search-index.v1.json
      - name: Actual pinned source occurrence accounting (aggregate only)
        run: |
          test "$(git -C .source-v35-search rev-parse HEAD)" = "8a02a8eb23ea37a7d8acb74d1bc193dd17657e5b"
          test "$(git -C .source-v35-search rev-parse HEAD^{tree})" = "c00cd1dc4ce65d5e8602de133d07e30a4934ad6a"
          test "$(git -C .source-v41-search rev-parse HEAD)" = "564ad2a07fddc0fdd30d103674b3eca61235a54b"
          test "$(git -C .source-v41-search rev-parse HEAD^{tree})" = "703ee4d6ffcd0021a1dc1f8fda1cec61e149d149"
          git -C .source-v35-search diff --exit-code HEAD
          git -C .source-v41-search diff --exit-code HEAD
          python -m grade9build.search_reconcile --v35-root .source-v35-search --v41-root .source-v41-search

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        if: always() && !cancelled()
        run: npm exec --no -- playwright-core install chromium
      - name: Actual IndexedDB and cognitive replay
        if: always() && !cancelled()
        run: node --experimental-strip-types --test --test-concurrency=1 --test-timeout=60000 --test-force-exit tests/browser/runtime.spec.ts tests/browser/bank.spec.ts tests/browser/catalogue.spec.ts tests/browser/legacy-host.spec.ts tests/browser/shell.spec.ts tests/browser/objective.spec.ts tests/browser/representation.spec.ts tests/browser/ink.spec.ts tests/browser/proof.spec.ts tests/browser/chemistry.spec.ts tests/browser/experiment.spec.ts tests/browser/paper.spec.ts tests/browser/models.spec.ts tests/browser/portable.spec.ts tests/browser/explorer.spec.ts tests/browser/core1a.spec.ts tests/browser/teaching-depth.spec.ts tests/browser/core1b.spec.ts tests/browser/reflection.spec.ts tests/browser/wave9-workspace.spec.ts tests/browser/a53-corrected.spec.ts
      - name: Diagnostic shell smoke
        if: always() && !cancelled()
        run: npm run test:smoke
