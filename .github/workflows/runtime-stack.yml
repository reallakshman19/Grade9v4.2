name: Runtime stack audit
on:
  push:
    branches:
      - feat/a48-immutable-cognitive-event-persistence
      - main
      - fix/runtime-integrity-r2
      - 'integration/downstream-*'
  workflow_dispatch:
concurrency:
  group: runtime-stack-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Strict typecheck and build
        run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Compile actual public projection fixture
        run: |
          python -m pip install -e '.[dev]'
          python -c 'import json; from grade9build.compile import ReleaseProjectionCompiler; print(json.dumps(ReleaseProjectionCompiler().compile_release(json.load(open("fixtures/synthetic/graph.json"))), ensure_ascii=False))' > "$RUNNER_TEMP/g9-projection.json"
          echo "G9_COMPILED_PROJECTION=$RUNNER_TEMP/g9-projection.json" >> "$GITHUB_ENV"
      - name: Runtime regression and adversarial tests
        if: always() && !cancelled()
        run: node --experimental-strip-types --test tests/runtime/*.test.ts tests/runtime/*.spec.ts
      - name: Self-contained Python contract and release regression
        if: always() && !cancelled()
        run: |
          echo 'NOT_RUN: test_platform.py requires external G9_R4_KIT; test_portable_compatibility.py requires external G9_V35_PORTABLE_PACKAGES. Full custody-dependent regression is separate.'
          PATH="$PWD/node_modules/.bin:$PATH" python -m pytest tests/contracts tests/build tests/release --ignore=tests/contracts/test_platform.py --ignore=tests/contracts/test_portable_compatibility.py -q
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        if: always() && !cancelled()
        run: npm exec --no -- playwright-core install chromium
      - name: Actual IndexedDB and cognitive replay
        if: always() && !cancelled()
        run: node --experimental-strip-types --test --test-concurrency=1 --test-timeout=60000 --test-force-exit tests/browser/runtime.spec.ts tests/browser/bank.spec.ts tests/browser/catalogue.spec.ts tests/browser/legacy-host.spec.ts tests/browser/shell.spec.ts tests/browser/objective.spec.ts tests/browser/representation.spec.ts tests/browser/ink.spec.ts tests/browser/proof.spec.ts
      - name: Diagnostic shell smoke
        if: always() && !cancelled()
        run: npm run test:smoke
