[build-system]
requires = ["setuptools==82.0.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "grade9v4-platform"
version = "4.2.0"
description = "Grade9v4.2 Six-Core Platform and Lossless Migration Toolchain"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jsonschema==4.26.0",
    "attrs==26.1.0",
    "jsonschema-specifications==2025.9.1",
    "referencing==0.37.0",
    "rpds-py==2026.5.1",
    "typing-extensions==4.16.0; python_version < '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "iniconfig==2.3.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    "colorama==0.4.6; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
