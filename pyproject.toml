[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grade9v4-platform"
version = "4.2.0"
description = "Grade9v4.2 Six-Core Platform and Lossless Migration Toolchain"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Grade9 Platform Team" }
]
dependencies = [
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-subtests>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
